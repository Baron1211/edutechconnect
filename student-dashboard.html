<script>
// ============================================================
// EDUTECH Student Dashboard
// ============================================================
const SUPABASE_URL = 'https://otblclienkqrnzixnwia.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im90YmxjbGllbmtxcm56aXhud2lhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzODgyNjAsImV4cCI6MjEwNDk2NDI2MH0.7ZC4AnROOH8Q0W7nCSx3NCxzYXGajr52oBGgEVP03Yk';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
window.CURRENT_STUDENT = null;

async function doLogout(e){
  if(e) e.preventDefault();
  await sb.auth.signOut();
  window.location.href = 'index.html';
}

async function showDashboard(profile){
  window.CURRENT_STUDENT = profile;
  await loadStudentData();
  document.getElementById('avatarName').textContent = profile.full_name;
  document.getElementById('avatarInitials').textContent = profile.full_name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
  document.getElementById('loadingGate').style.display = 'none';
  document.getElementById('dashboardRoot').classList.remove('hidden');
  render();
}

(async function checkSession(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session){ window.location.href = 'index.html#/register'; return; }

  const { data: profile, error } = await sb.from('profiles').select('*').eq('id', session.user.id).single();
  if(error || !profile || profile.role !== 'student'){
    await sb.auth.signOut();
    window.location.href = 'index.html#/register';
    return;
  }
  if(['Pending','Under Review','Rejected'].includes(profile.status)){
    document.getElementById('loadingGate').innerHTML = `
      <div class="text-center max-w-sm px-6">
        <div class="w-14 h-14 rounded-full bg-forest-50 text-forest-600 flex items-center justify-center mx-auto mb-5">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
        </div>
        <h2 class="font-display text-xl font-bold text-char-900 mb-2">Your application is still under review</h2>
        <p class="text-char-500 text-sm mb-6">An EDUTECH administrator will approve your account soon. We'll reach out on WhatsApp once it's ready.</p>
        <a href="index.html" class="inline-block border border-char-900 text-char-900 font-semibold px-6 py-3 rounded-full hover:bg-char-900 hover:text-white transition-colors">Back to home</a>
      </div>`;
    return;
  }
  if(profile.status === 'Suspended'){
    document.getElementById('loadingGate').innerHTML = `
      <div class="text-center max-w-sm px-6">
        <h2 class="font-display text-xl font-bold text-char-900 mb-2">This account is currently suspended</h2>
        <p class="text-char-500 text-sm mb-6">Contact EDUTECH on WhatsApp if you think this is a mistake.</p>
        <a href="https://wa.me/233598293157" target="_blank" class="inline-block bg-forest-600 text-white font-semibold px-6 py-3 rounded-full hover:bg-forest-700 transition-colors">Message EDUTECH</a>
      </div>`;
    return;
  }

  ['/dashboard','Dashboard','dashboard'],
  ['/courses','My Courses','book'],
  ['/schedule','Class Schedule','calendar'],
  ['/assignments','Assignments','clipboard'],
  ['/notes','Lecture Notes','file'],
  ['/books','Books','bookopen'],
  ['/payments','Payments','card'],

  ['/announcements','Announcements','megaphone'],
  ['/profile','Profile','user'],

function navHtml(active){
  return NAV.map(([path,label,ic])=>{
    const isActive = active===path;
    const count = path==='/notifications' ? NOTIFICATIONS.filter(n=>!n.read).length : (path==='/assignments' ? ASSIGNMENTS.filter(a=>a.status==='Pending').length : 0);
    return `<a href="#${path}" data-navlink class="flex items-center justify-between gap-2 px-3 py-2.5 rounded-xl font-medium transition-all duration-200 ${isActive?'bg-gradient-to-r from-forest-600 to-forest-500 text-white shadow-lg shadow-forest-900/30':'text-white/70 hover:bg-white/10 hover:text-white'}">
      <span class="flex items-center gap-2.5"><span class="${isActive?'text-white':'text-forest-400'}">${icon(ic)}</span>${label}</span>
      ${count?`<span class="text-[11px] font-bold ${isActive?'bg-white/20 text-white':'bg-forest-500 text-white'} rounded-full px-1.5 py-0.5 min-w-[18px] text-center">${count}</span>`:''}
    </a>`;
  }).join('');
}

// ---------- Live data (loaded after login via loadStudentData()) ----------
let MY_COURSES = [];
let SCHEDULE = [];
let ASSIGNMENTS = [];
let NOTES = [];
let BOOKS = [];
let NOTIFICATIONS = [];
let ANNOUNCEMENTS = [];
let PROFILE = { name:'', email:'', phone:'', school:'', level:'', location:'', major:'' };
let PAYMENT = { status:'Unpaid', amount:'', method:'', date:'' };
let studentDataLoaded = false;

async function loadStudentData(){
  const studentId = window.CURRENT_STUDENT.id;
  PROFILE = {
    name: window.CURRENT_STUDENT.full_name, email: window.CURRENT_STUDENT.email,
    phone: window.CURRENT_STUDENT.phone || '', school: window.CURRENT_STUDENT.school || '',
    level: window.CURRENT_STUDENT.shs_level || '', location: window.CURRENT_STUDENT.location || '',
    major: window.CURRENT_STUDENT.major || ''
  };

  const { data: enrollRows } = await sb.from('course_enrollments')
    .select('course_id, course:course_id ( id, name, description, teacher_id, teacher:teacher_id ( full_name ) )')
    .eq('student_id', studentId);
  const courseIds = (enrollRows||[]).map(e=>e.course_id);
  const courseNameById = {}; (enrollRows||[]).forEach(e=>{ if(e.course) courseNameById[e.course_id]=e.course.name; });

  const [{ data: scheduleRows }, { data: assignmentRows }, { data: noteRows }, { data: bookRows }, { data: announcementRows }, { data: paymentRows }] = await Promise.all([
    courseIds.length ? sb.from('class_schedules').select('*').in('course_id', courseIds) : Promise.resolve({data:[]}),
    courseIds.length ? sb.from('assignments').select('*').in('course_id', courseIds).order('deadline') : Promise.resolve({data:[]}),
    courseIds.length ? sb.from('lecture_notes').select('*').in('course_id', courseIds).order('created_at',{ascending:false}) : Promise.resolve({data:[]}),
    sb.from('books').select('*').order('created_at',{ascending:false}),
    sb.from('announcements').select('*').order('created_at',{ascending:false}).limit(10),
    sb.from('payments').select('*').eq('student_id', studentId).order('created_at',{ascending:false}).limit(1)
  ]);

  const assignmentIds = (assignmentRows||[]).map(a=>a.id);
  const { data: subRows } = assignmentIds.length
    ? await sb.from('assignment_submissions').select('*').in('assignment_id', assignmentIds).eq('student_id', studentId)
    : { data: [] };
  const subByAssignment = {}; (subRows||[]).forEach(s=>subByAssignment[s.assignment_id]=s);

  MY_COURSES = (enrollRows||[]).filter(e=>e.course).map(e=>{
    const slot = (scheduleRows||[]).find(s=>s.course_id===e.course_id);
    return {
      id: e.course_id, name: e.course.name,
      teacher: e.course.teacher ? e.course.teacher.full_name : 'Unassigned',
      desc: e.course.description || '',
      day: slot ? slot.day_of_week : '—',
      time: slot ? slot.start_time+' – '+slot.end_time : 'No class scheduled yet',
      link: slot ? slot.meet_link : ''
    };
  });

  SCHEDULE = (scheduleRows||[]).map(s=>({
    course: courseNameById[s.course_id] || '', day: s.day_of_week,
    time: s.start_time+' – '+s.end_time, link: s.meet_link || ''
  }));

  ASSIGNMENTS = (assignmentRows||[]).map(a=>{
    const sub = subByAssignment[a.id];
    return {
      id: a.id, title: a.title, course: courseNameById[a.course_id] || '',
      deadline: a.deadline, maxScore: a.max_score,
      status: sub ? sub.status : 'Pending',
      score: sub ? sub.score : null, feedback: sub ? sub.feedback : null
    };
  });

  NOTES = (noteRows||[]).map(n=>({ title: n.title, course: courseNameById[n.course_id] || '', date: n.created_at }));

  BOOKS = (bookRows||[]).map(b=>({ name: b.name, course: courseNameById[b.course_id] || 'General', price: 'GHS '+b.price }));

  ANNOUNCEMENTS = (announcementRows||[]).map(a=>({ title: a.title, message: a.message, author: a.author || 'Admin', date: a.created_at }));

  if(paymentRows && paymentRows.length){
    const p = paymentRows[0];
    PAYMENT = { status: p.status, amount: 'GHS '+p.amount, method: p.method || '—', date: p.created_at };
  } else {
    PAYMENT = { status:'Unpaid', amount:'—', method:'—', date:'' };
  }

  NOTIFICATIONS = []; // not wired in this pass — no notification rows are written yet

  studentDataLoaded = true;
}

// ---------- Helpers ----------
function statusBadge(status){
  const map = { 'Pending':'bg-gray-100 text-gray-600','Submitted':'bg-blue-50 text-blue-600','Graded':'bg-forest-100 text-forest-700' };
  return `<span class="text-xs font-semibold px-2.5 py-1 rounded-full ${map[status]||'bg-gray-100 text-gray-600'}">${status}</span>`;
}
function fmtDate(d){ return new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}); }

// ---------- Lightweight inline SVG charts (no external libraries) ----------
function areaChart(values, opts){
  opts = opts||{};
  const w = opts.w||520, h = opts.h||160, pad = 8;
  const max = Math.max(...values) * 1.1 || 1;
  const min = Math.min(...values) * 0.9;
  const stepX = (w - pad*2) / (values.length-1);
  const scaleY = v => h - pad - ((v-min)/(max-min||1)) * (h-pad*2);
  const pts = values.map((v,i)=>[pad+i*stepX, scaleY(v)]);
  const line = pts.map((p,i)=>(i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const area = line + ` L${pts[pts.length-1][0].toFixed(1)},${h-pad} L${pts[0][0].toFixed(1)},${h-pad} Z`;
  const gid = 'ag'+Math.random().toString(36).slice(2,8);
  return `
  <svg viewBox="0 0 ${w} ${h}" class="w-full h-full" preserveAspectRatio="none">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c7f4d" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2c7f4d" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${area}" fill="url(#${gid})"/>

  </svg>`;
}
function donutChartSvg(segments, opts){
  opts = opts||{};
  const size = opts.size||120, stroke = opts.stroke||16, r = (size-stroke)/2, c = size/2;
  const total = segments.reduce((s,x)=>s+x.value,0) || 1;
  let offset = 0;
  const circumference = 2*Math.PI*r;
  const arcs = segments.map(seg=>{
    const frac = seg.value/total;
    const dash = frac*circumference;
    const el = `<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${seg.color}" stroke-width="${stroke}" stroke-dasharray="${dash.toFixed(1)} ${(circumference-dash).toFixed(1)}" stroke-dashoffset="${(-offset).toFixed(1)}" stroke-linecap="butt" transform="rotate(-90 ${c} ${c})"/>`;
    offset += dash;
    return el;
  }).join('');
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">${arcs}<circle cx="${c}" cy="${c}" r="${r-stroke/2-4}" fill="white"/></svg>`;
}
function toast(msg){
  const t = document.createElement('div');
  t.className = 'fixed bottom-6 left-1/2 -translate-x-1/2 bg-char-900 text-white text-sm font-medium px-5 py-3 rounded-full shadow-soft z-[100] fade-in';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; t.style.transition='opacity .3s'; setTimeout(()=>t.remove(),300); }, 2200);
}

}

      <div><label class="text-sm font-medium text-char-800">Amount paid (GHS)</label><input type="number" id="pay_amount" required class="mt-1.5 w-full border border-forest-200 rounded-xl px-4 py-3"/></div>
      <div><label class="text-sm font-medium text-char-800">Payment method</label>
        <select id="pay_method" class="mt-1.5 w-full border border-forest-200 rounded-xl px-4 py-3">
          <option>Mobile Money</option><option>Bank Transfer</option>
        </select>
      </div>
      <p class="text-xs text-char-400">File upload for a receipt/screenshot isn't connected yet — this records your submission for the admin to verify manually.</p>
      <button class="w-full bg-forest-600 hover:bg-forest-700 text-white font-semibold py-3 rounded-full transition-colors">Submit for verification</button>
    </form>
  `);
}
async function submitProof(e){
  e.preventDefault();
  const { error } = await sb.from('payments').insert({
    student_id: window.CURRENT_STUDENT.id,
    amount: Number(pay_amount.value) || 0,
    method: pay_method.value,
    status: 'Payment Submitted'
  });
  if(error){ toast('Failed: ' + error.message); return false; }
  toast('Proof submitted — admin will verify shortly');
  closeModal();
  await loadStudentData();
  render();
  return false;
}

  <div class="bg-white border border-forest-100 rounded-2xl p-6 sm:p-8 max-w-xl">

      <div><label class="text-sm font-medium text-char-800">Email</label><input value="${PROFILE.email}" disabled class="mt-1.5 w-full border border-forest-200 rounded-xl px-4 py-3 bg-gray-50 text-char-400"/></div>
      <div><label class="text-sm font-medium text-char-800">Phone</label><input id="pf_phone" value="${PROFILE.phone}" class="mt-1.5 w-full border border-forest-200 rounded-xl px-4 py-3"/></div>
      <div><label class="text-sm font-medium text-char-800">School</label><input id="pf_school" value="${PROFILE.school}" class="mt-1.5 w-full border border-forest-200 rounded-xl px-4 py-3"/></div>
      <div><label class="text-sm font-medium text-char-800">SHS level</label><input id="pf_level" value="${PROFILE.level}" class="mt-1.5 w-full border border-forest-200 rounded-xl px-4 py-3"/></div>
      <div><label class="text-sm font-medium text-char-800">Location</label><input id="pf_location" value="${PROFILE.location}" class="mt-1.5 w-full border border-forest-200 rounded-xl px-4 py-3"/></div>
      <button class="sm:col-span-2 bg-forest-600 hover:bg-forest-700 text-white font-semibold py-3 rounded-full transition-colors">Save changes</button>
    </form>
  </div>
`;
async function saveProfile(e){
  e.preventDefault();
  const { error } = await sb.from('profiles').update({
    full_name: pf_name.value, phone: pf_phone.value, school: pf_school.value,
    shs_level: pf_level.value, location: pf_location.value
  }).eq('id', window.CURRENT_STUDENT.id);
  if(error){ toast('Failed: ' + error.message); return false; }
  PROFILE = { ...PROFILE, name:pf_name.value, phone:pf_phone.value, school:pf_school.value, level:pf_level.value, location:pf_location.value };
  document.getElementById('avatarName').textContent = PROFILE.name;
  document.getElementById('avatarInitials').textContent = PROFILE.name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
  toast('Profile updated'); render();
  return false;
}
